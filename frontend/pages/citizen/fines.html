<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Fines · NatiFine SA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a4d8c'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>NF</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim hidden" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>My Fines</h1>
            <p>View, pay or dispute every traffic fine linked to your vehicles.</p>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="filter-bar">
              <div class="form-group flex-1">
                <label class="sr-only" for="search">Search</label>
                <input class="input" id="search" placeholder="Search by fine number, offence or location…">
              </div>
              <div class="form-group">
                <label for="filter">Status</label>
                <select class="select" id="filter">
                  <option value="">All statuses</option>
                  <option value="ISSUED">Issued (unpaid)</option>
                  <option value="PAID">Paid</option>
                  <option value="DISPUTED">Disputed</option>
                  <option value="CANCELLED">Cancelled</option>
                </select>
              </div>
              <div class="form-group">
                <button class="btn btn-secondary" id="refresh" type="button">Refresh</button>
              </div>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Fine number</th><th>Offence</th><th>Vehicle</th>
                  <th>Amount</th><th>Issued</th><th>Due</th><th>Status</th><th class="actions">Action</th>
                </tr>
              </thead>
              <tbody id="rows">
                <tr><td colspan="8"><div class="spinner"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>


  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>NFShell.mount({ role: "citizen", active: "fines", title: "My Fines", subtitle: "Traffic fines linked to your account" });</script>
  <script src="/assets/js/pages/citizen-fines.js"></script>
</body>
</html>
