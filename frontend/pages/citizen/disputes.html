<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disputes · NatiFine SA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a4d8c'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>NF</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim hidden" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>My Disputes</h1>
            <p>Track the fines you have contested and their adjudication status.</p>
          </div>
          <a class="btn" href="/pages/citizen/fines.html?filter=ISSUED">Dispute a fine</a>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>#</th><th>Fine</th><th>Submitted</th><th>Status</th><th>Reviewer</th><th class="actions">Details</th></tr>
              </thead>
              <tbody id="rows"><tr><td colspan="6"><div class="spinner"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>


  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>NFShell.mount({ role: "citizen", active: "disputes", title: "Disputes", subtitle: "Your contested fines" });</script>
  <script src="/assets/js/pages/citizen-disputes.js"></script>
</body>
</html>
