<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disputes · NatiFine SA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a4d8c'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>NF</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim hidden" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>Dispute Reviews</h1>
            <p>Review pending disputes and adjudicate on contested fines.</p>
          </div>
        </div>
        <div class="alert alert-info mb-24">
          <span>By default this shows only <strong>pending</strong> reviews. Use search to find any dispute by fine number or citizen.</span>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="filter-bar">
              <div class="form-group flex-1">
                <label class="sr-only" for="search">Search</label>
                <input class="input" id="search" placeholder="Search by fine number or citizen name…">
              </div>
              <div class="form-group">
                <label for="filter">Status</label>
                <select class="select" id="filter">
                  <option value="">All statuses</option>
                  <option value="NEW">New</option>
                  <option value="PENDING">Pending</option>
                  <option value="UNDER_REVIEW">Under review</option>
                  <option value="MORE_INFORMATION_REQUIRED">More info required</option>
                  <option value="APPROVED">Approved</option>
                  <option value="REJECTED">Rejected</option>
                  <option value="CLOSED">Closed</option>
                </select>
              </div>
              <div class="form-group">
                <button class="btn btn-secondary" id="refresh" type="button">Refresh</button>
              </div>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>#</th><th>Fine</th><th>Citizen</th><th>Submitted</th><th>Status</th><th class="actions">Action</th></tr></thead>
              <tbody id="rows"><tr><td colspan="6"><div class="spinner"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/assets/js/config.js"></script>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>NFShell.mount({ role: "officer", active: "disputes", title: "Disputes", subtitle: "Review & adjudicate" });</script>
  <script src="/assets/js/pages/shared-disputes.js"></script>
</body>
</html>
