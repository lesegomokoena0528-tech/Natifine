<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broadcast · NatiFine SA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a4d8c'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>NF</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim hidden" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>Broadcast</h1>
            <p>Send a message to one user, all citizens, all officers or everyone.</p>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <div class="card-header"><h3>Compose</h3></div>
            <div class="card-body">
              <div class="form-group">
                <label>Message source</label>
                <div class="tabs" id="mode" style="margin-bottom:10px">
                  <button class="tab active" data-mode="custom" type="button">Custom message</button>
                  <button class="tab" data-mode="template" type="button">Template</button>
                </div>
              </div>

              <div class="form-grid mt-16">
                <div class="form-group">
                  <label for="audience">Audience <span class="req">*</span></label>
                  <select class="select" id="audience">
                    <option value="all">Everyone</option>
                    <option value="CITIZEN">All citizens</option>
                    <option value="OFFICER">All officers</option>
                    <option value="ADMIN">All admins</option>
                    <option value="single">A single user…</option>
                  </select>
                </div>
                <div class="form-group hidden" id="user-wrap">
                  <label for="user">Recipient <span class="req">*</span></label>
                  <select class="select" id="user"><option value="">Loading…</option></select>
                </div>
                <div class="form-group">
                  <label for="channel">Channel <span class="req">*</span></label>
                  <select class="select" id="channel">
                    <option value="EMAIL">Email</option>
                    <option value="SMS">SMS</option>
                    <option value="WHATSAPP">WhatsApp</option>
                  </select>
                </div>
              </div>

              <div id="custom-fields">
                <div class="form-grid mt-16">
                  <div class="form-group">
                    <label for="type">Type <span class="req">*</span></label>
                    <select class="select" id="type"></select>
                  </div>
                  <div class="form-group">
                    <label for="title">Title <span class="req">*</span></label>
                    <input class="input" id="title" maxlength="255" placeholder="e.g. Scheduled system maintenance">
                  </div>
                </div>
                <div class="form-group">
                  <label for="message">Message <span class="req">*</span></label>
                  <textarea class="textarea" id="message" rows="6" placeholder="Type the message to send…"></textarea>
                </div>
              </div>

              <div id="template-fields" class="hidden">
                <div class="form-group">
                  <label for="template">Template <span class="req">*</span></label>
                  <select class="select" id="template"><option value="">Loading…</option></select>
                </div>
                <div class="card mt-8 hidden" id="template-preview">
                  <div class="card-body">
                    <div class="text-soft" style="font-size:.85rem;margin-bottom:6px">Preview</div>
                    <div id="template-body" class="mono" style="white-space:pre-wrap;font-size:.85rem"></div>
                  </div>
                </div>
                <div id="variables"></div>
              </div>

              <div class="alert alert-info mt-16" id="recipient-note">Recipient address is taken from each user's email (or phone for SMS/WhatsApp).</div>

              <div class="flex justify-between items-center mt-16">
                <span class="text-soft" id="target-count">—</span>
                <button class="btn" id="send" type="button">Send broadcast</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header"><h3>Result</h3></div>
            <div class="card-body" id="result">
              <p class="text-soft">No broadcast sent yet.</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/assets/js/config.js"></script>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>NFShell.mount({ role: "admin", active: "broadcast", title: "Broadcast", subtitle: "Send notifications to users" });</script>
  <script src="/assets/js/pages/admin-broadcast.js"></script>
</body>
</html>
