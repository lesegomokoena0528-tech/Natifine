<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments · NatiFine SA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a4d8c'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>NF</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim hidden" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>Payments</h1>
            <p>All transactions, revenue and refund activity.</p>
          </div>
        </div>

        <div class="stat-grid mb-24">
          <div class="stat"><div class="stat-label">Transactions</div><div class="stat-value" id="t-payments">—</div><div class="stat-sub">All payments</div></div>
          <div class="stat accent"><div class="stat-label">Successful</div><div class="stat-value" id="t-success">—</div><div class="stat-sub">Completed</div></div>
          <div class="stat warn"><div class="stat-label">Pending</div><div class="stat-value" id="t-pending">—</div><div class="stat-sub">Awaiting verify</div></div>
          <div class="stat danger"><div class="stat-label">Failed / refunds</div><div class="stat-value" id="t-failed">—</div><div class="stat-sub"><span id="t-refunds">0</span> refunds</div></div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="filter-bar">
              <div class="form-group flex-1">
                <label class="sr-only" for="search">Search</label>
                <input class="input" id="search" placeholder="Search by reference or transaction ID…">
              </div>
              <div class="form-group">
                <label for="status">Status</label>
                <select class="select" id="status">
                  <option value="">All statuses</option>
                  <option value="PENDING">Pending</option>
                  <option value="PAID">Paid</option>
                  <option value="FAILED">Failed</option>
                  <option value="REFUNDED">Refunded</option>
                </select>
              </div>
              <div class="form-group"><button class="btn btn-secondary" id="refresh" type="button">Refresh</button></div>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>Reference</th><th>Fine</th><th>Gateway</th><th>Method</th><th>Amount</th><th>Status</th><th>Paid</th><th class="actions">Receipt</th></tr>
              </thead>
              <tbody id="rows"><tr><td colspan="8"><div class="spinner"></div></td></tr></tbody>
            </table>
          </div>
          <div class="card-footer" id="pager"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="/assets/js/config.js"></script>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>NFShell.mount({ role: "admin", active: "payments", title: "Payments", subtitle: "Transactions & revenue" });</script>
  <script src="/assets/js/pages/admin-payments.js"></script>
</body>
</html>
