<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refunds · NatiFine SA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a4d8c'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>NF</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim hidden" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>Refunds</h1>
            <p>Review and approve citizen refund requests.</p>
          </div>
        </div>

        <div class="stat-grid mb-24">
          <div class="stat"><div class="stat-label">Refunds</div><div class="stat-value" id="t-total">—</div><div class="stat-sub">All requests</div></div>
          <div class="stat warn"><div class="stat-label">Pending</div><div class="stat-value" id="t-pending">—</div><div class="stat-sub">Awaiting approval</div></div>
          <div class="stat accent"><div class="stat-label">Completed</div><div class="stat-value" id="t-completed">—</div><div class="stat-sub">Approved &amp; processed</div></div>
          <div class="stat danger"><div class="stat-label">Refunded value</div><div class="stat-value" id="t-amount">—</div><div class="stat-sub">Completed refunds</div></div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="filter-bar">
              <div class="form-group flex-1">
                <label class="sr-only" for="search">Search</label>
                <input class="input" id="search" placeholder="Search by refund reference, payment or applicant…">
              </div>
              <div class="form-group">
                <label for="status">Status</label>
                <select class="select" id="status">
                  <option value="">All statuses</option>
                  <option value="PENDING">Pending</option>
                  <option value="APPROVED">Approved</option>
                  <option value="PROCESSING">Processing</option>
                  <option value="COMPLETED">Completed</option>
                  <option value="REJECTED">Rejected</option>
                  <option value="FAILED">Failed</option>
                </select>
              </div>
              <div class="form-group"><button class="btn btn-secondary" id="refresh" type="button">Refresh</button></div>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>Refund</th><th>Payment</th><th>Fine</th><th>Applicant</th><th>Amount</th><th>Status</th><th>Requested</th><th class="actions">Actions</th></tr>
              </thead>
              <tbody id="rows"><tr><td colspan="8"><div class="spinner"></div></td></tr></tbody>
            </table>
          </div>
          <div class="card-footer" id="pager"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="/assets/js/config.js"></script>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>NFShell.mount({ role: "admin", active: "refunds", title: "Refunds", subtitle: "Approve citizen refund requests" });</script>
  <script src="/assets/js/pages/admin-refunds.js"></script>
</body>
</html>
