<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · NatiFine SA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a4d8c'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>NF</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim hidden" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>Reports &amp; Exports</h1>
            <p>Cross-platform analytics. Export the full system report in your preferred format.</p>
          </div>
          <div class="flex gap-8 flex-wrap">
            <button class="btn btn-secondary" id="exp-csv" type="button">Export CSV</button>
            <button class="btn btn-secondary" id="exp-excel" type="button">Export Excel</button>
            <button class="btn" id="exp-pdf" type="button">Export PDF</button>
          </div>
        </div>

        <p class="small text-muted" id="generated"></p>

        <div class="grid grid-2 mb-24">
          <div class="card">
            <div class="card-header"><h2>Revenue</h2></div>
            <div class="card-body"><dl class="kv" id="r-revenue"></dl></div>
          </div>
          <div class="card">
            <div class="card-header"><h2>Fines</h2></div>
            <div class="card-body"><dl class="kv" id="r-fines"></dl></div>
          </div>
          <div class="card">
            <div class="card-header"><h2>Users</h2></div>
            <div class="card-body"><dl class="kv" id="r-users"></dl></div>
          </div>
          <div class="card">
            <div class="card-header"><h2>Vehicles</h2></div>
            <div class="card-body"><dl class="kv" id="r-vehicles"></dl></div>
          </div>
          <div class="card">
            <div class="card-header"><h2>Disputes</h2></div>
            <div class="card-body"><dl class="kv" id="r-disputes"></dl></div>
          </div>
          <div class="card">
            <div class="card-header"><h2>Notifications</h2></div>
            <div class="card-body"><dl class="kv" id="r-notifications"></dl></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h2>Platform summary</h2></div>
          <div class="card-body"><div class="stat-grid" id="r-dashboard"></div></div>
        </div>
      </main>
    </div>
  </div>
  <script src="/assets/js/config.js"></script>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>NFShell.mount({ role: "admin", active: "reports", title: "Reports", subtitle: "Analytics & exports" });</script>
  <script src="/assets/js/pages/admin-reports.js"></script>
</body>
</html>
