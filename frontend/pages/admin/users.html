<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users · NatiFine SA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a4d8c'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>NF</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim hidden" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>User Management</h1>
            <p>Create, edit, suspend and manage every account on the platform.</p>
          </div>
          <button class="btn" id="add" type="button">Create user</button>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="filter-bar">
              <div class="form-group flex-1">
                <label class="sr-only" for="search">Search</label>
                <input class="input" id="search" placeholder="Search by name, email or ID number…">
              </div>
              <div class="form-group">
                <label for="role">Role</label>
                <select class="select" id="role">
                  <option value="">All roles</option>
                  <option value="ADMIN">Administrator</option>
                  <option value="OFFICER">Officer</option>
                  <option value="CITIZEN">Citizen</option>
                </select>
              </div>
              <div class="form-group">
                <label for="status">Status</label>
                <select class="select" id="status">
                  <option value="">All statuses</option>
                  <option value="ACTIVE">Active</option>
                  <option value="INACTIVE">Inactive</option>
                  <option value="SUSPENDED">Suspended</option>
                </select>
              </div>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>Name</th><th>Email</th><th>ID number</th><th>Phone</th><th>Role</th><th>Status</th><th class="actions">Actions</th></tr>
              </thead>
              <tbody id="rows"><tr><td colspan="7"><div class="spinner"></div></td></tr></tbody>
            </table>
          </div>
          <div class="card-footer" id="pager"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="/assets/js/config.js"></script>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>NFShell.mount({ role: "admin", active: "users", title: "Users", subtitle: "Account management" });</script>
  <script src="/assets/js/pages/admin-users.js"></script>
</body>
</html>
